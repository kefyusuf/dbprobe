name: modernc-binding-bootstrap

on:
  push:
    branches: [feat/modernc-sqlite-binding]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Remove obsolete adapter-local core rule
        run: |
          python3 - <<'PY'
          from pathlib import Path

          rules = Path("adapters/mysql/findings/rules.go")
          text = rules.read_text()
          text = text.replace("\t\tconnectionSaturationRule{},\n", "", 1)
          start_marker = "type connectionSaturationRule struct{}\n"
          end_marker = "type longTransactionRule struct{}\n"
          if start_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              text = text[:start] + text[end:]
          rules.write_text(text)

          obsolete_test = Path("adapters/mysql/findings/connections_test.go")
          if obsolete_test.exists():
              obsolete_test.unlink()
          PY
      - name: Resolve modules and format source
        run: |
          go mod tidy
          if [ -f test/acceptance/sqlite-drivers/go.mod ]; then
            (cd test/acceptance/sqlite-drivers && go mod tidy)
          fi
          gofmt -w $(find . -name '*.go' -not -path './vendor/*')
          if git diff --quiet; then
            echo "Dependency, cleanup, and formatting state already clean"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "refactor: remove duplicate MySQL core rule"
            git push origin HEAD:feat/modernc-sqlite-binding
          fi
      - name: Verify candidate persistence contracts
        run: make test-sqlite-drivers
      - name: Run complete driver-inclusive gate
        run: make ci
