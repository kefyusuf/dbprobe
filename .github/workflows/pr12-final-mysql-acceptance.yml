name: pr12-final-mysql-acceptance

on:
  push:
    branches: [fix/mysql-connection-security]

permissions:
  contents: read

jobs:
  mysql-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Run full MySQL acceptance
        run: make test-mysql
      - name: Run standalone default-DSN integration
        shell: bash
        run: |
          set -euo pipefail
          compose='docker compose -f test/integration/mysql/docker-compose.yml'
          trap "$compose down -v" EXIT
          $compose up -d --wait
          DBPROBE_MYSQL_INTEGRATION=1 go test ./test/integration/mysql -v
