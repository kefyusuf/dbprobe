name: pr12-mysql-acceptance

on:
  push:
    branches: [fix/mysql-connection-security]

permissions:
  contents: read

jobs:
  mysql-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: make test-mysql
