name: sqlite-cli-orchestration-ci

on:
  push:
    branches: [feat/sqlite-cli-orchestration]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet repository
        run: go vet ./...
      - name: Test repository
        run: go test ./...
      - name: Race-test repository
        run: go test -race ./...
      - name: Build and smoke CLI
        run: make smoke
      - name: Report known formatting debt
        if: always()
        run: gofmt -l $(find . -name '*.go' -not -path './vendor/*')
