name: sqlite-cli-orchestration-ci

on:
  push:
    branches: [feat/sqlite-cli-orchestration]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Apply known integration formatting debt
        run: |
          files=(
            internal/app/target/service_test.go
            internal/app/inspect/rule_precedence_test.go
            internal/core/temporal/diff_test.go
            internal/core/temporal/query_regression.go
            cmd/dbprobe/explain_test.go
            test/architecture/mongodb_probe_test.go
            adapters/mysql/explain_test.go
            adapters/mysql/explain.go
          )
          gofmt -w "${files[@]}"
          if git diff --quiet -- "${files[@]}"; then
            echo "No formatting changes needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "${files[@]}"
            git commit -m "style: gofmt integrated source"
            git push origin HEAD:feat/sqlite-cli-orchestration
          fi
      - run: make ci
