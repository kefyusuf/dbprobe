name: sqlite-cli-orchestration-ci

on:
  push:
    branches: [feat/sqlite-cli-orchestration]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: List unformatted Go files
        run: gofmt -l $(find . -name '*.go' -not -path './vendor/*')
      - run: make ci
