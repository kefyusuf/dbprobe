name: pr12-standalone-mysql

on:
  push:
    branches: [fix/mysql-connection-security]

permissions:
  contents: read

jobs:
  standalone-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Run standalone MySQL integration defaults
        shell: bash
        run: |
          set -euo pipefail
          compose='docker compose -f test/integration/mysql/docker-compose.yml'
          trap "$compose down -v" EXIT
          $compose up -d --wait
          DBPROBE_MYSQL_INTEGRATION=1 go test ./test/integration/mysql -v
