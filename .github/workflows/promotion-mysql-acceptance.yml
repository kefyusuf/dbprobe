name: promotion-mysql-acceptance

on:
  push:
    branches:
      - fix/promotion-review-findings
    paths:
      - 'adapters/mysql/**'
      - 'internal/core/collection/**'
      - 'cmd/dbprobe/**'
      - 'test/integration/mysql/**'
      - 'test/contract/**'
      - 'Makefile'
      - '.github/workflows/promotion-mysql-acceptance.yml'

permissions:
  contents: read

jobs:
  mysql-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: make test-mysql
