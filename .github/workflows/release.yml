name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    outputs:
      release_commit: ${{ steps.validate.outputs.release_commit }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache: true

      - name: Validate release tag
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag must match canonical vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if ! [[ -s LICENSE ]]; then
            echo "release requires a non-empty root LICENSE before publishing" >&2
            exit 1
          fi
          git cat-file -e "${GITHUB_REF_NAME}^{commit}"
          release_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "release tag must point to a commit in main history" >&2
            exit 1
          fi
          echo "RELEASE_COMMIT=${release_commit}" >> "$GITHUB_ENV"
          echo "release_commit=${release_commit}" >> "$GITHUB_OUTPUT"

      - name: Verify tagged source
        run: make ci

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          source_epoch="$(git show -s --format=%ct "$RELEASE_COMMIT")"
          build_date="$(date -u -d "@${source_epoch}" +'%Y-%m-%dT%H:%M:%SZ')"
          bash ./scripts/build-release.sh "$GITHUB_REF_NAME" "$RELEASE_COMMIT" "$build_date" "$PWD/dist"

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist

      - name: Verify release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          checksum_files=(dbprobe_*_checksums.txt)
          if [[ ${#checksum_files[@]} -ne 1 ]]; then
            echo "expected exactly one release checksum manifest" >&2
            exit 1
          fi
          sha256sum -c "${checksum_files[0]}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_RELEASE_COMMIT: ${{ needs.build.outputs.release_commit }}
        shell: bash
        run: |
          set -euo pipefail

          resolve_remote_tag_commit() {
            local object_type object_sha depth=0
            IFS=$'\t' read -r object_type object_sha < <(
              gh api "repos/${GH_REPO}/git/ref/tags/${GITHUB_REF_NAME}" \
                --jq '[.object.type, .object.sha] | @tsv'
            )
            while [[ "$object_type" == "tag" ]]; do
              depth=$((depth + 1))
              if (( depth > 8 )); then
                echo "release tag peel depth exceeded" >&2
                return 1
              fi
              IFS=$'\t' read -r object_type object_sha < <(
                gh api "repos/${GH_REPO}/git/tags/${object_sha}" \
                  --jq '[.object.type, .object.sha] | @tsv'
              )
            done
            if [[ "$object_type" != "commit" || ! "$object_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "release tag does not resolve to a commit" >&2
              return 1
            fi
            printf '%s\n' "$object_sha"
          }

          remote_commit="$(resolve_remote_tag_commit)"
          if [[ "$remote_commit" != "$EXPECTED_RELEASE_COMMIT" ]]; then
            echo "release tag moved after artifact build" >&2
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "dbprobe $GITHUB_REF_NAME" \
            --generate-notes
