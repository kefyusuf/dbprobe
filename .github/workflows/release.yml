name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache: true

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if ! [[ -s LICENSE ]]; then
            echo "release requires a non-empty root LICENSE before publishing" >&2
            exit 1
          fi
          git cat-file -e "${GITHUB_REF_NAME}^{commit}"
          release_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "release tag must point to a commit in main history" >&2
            exit 1
          fi
          echo "RELEASE_COMMIT=${release_commit}" >> "$GITHUB_ENV"

      - name: Verify tagged source
        run: make ci

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          source_epoch="$(git show -s --format=%ct "$RELEASE_COMMIT")"
          build_date="$(date -u -d "@${source_epoch}" +'%Y-%m-%dT%H:%M:%SZ')"
          bash ./scripts/build-release.sh "$GITHUB_REF_NAME" "$RELEASE_COMMIT" "$build_date" "$PWD/dist"

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist

      - name: Verify release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          checksum_files=(dbprobe_*_checksums.txt)
          if [[ ${#checksum_files[@]} -ne 1 ]]; then
            echo "expected exactly one release checksum manifest" >&2
            exit 1
          fi
          sha256sum -c "${checksum_files[0]}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "dbprobe $GITHUB_REF_NAME" \
            --generate-notes
